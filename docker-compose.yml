version: "3.9"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: employee-mssql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Berkan!123"
    volumes:
      - mssql_data:/var/opt/mssql


  api:
    image: employee-api:latest
    container_name: employee-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=EmployeeTaskManagementDb;User Id=sa;Password=Berkan!123;TrustServerCertificate=True;"
    depends_on:
      - mssql
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    image: employee-frontend:latest
    container_name: employee-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: on-failure

volumes:
  mssql_data:
    driver: local